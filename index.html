<title>Atrium 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500&display=swap">
<style>
  /* Layout: full-bleed 3D canvas, one floating control card top-left, hint strip bottom. */
  :root {
    --bg: #dfe6ec;          /* daylight grey-blue behind the model */
    --panel: rgba(255, 255, 255, 0.86);
    --fg: #1d2a33;
    --muted: #5a6872;
    --line: rgba(29, 42, 51, 0.14);
    --accent: #2f7d4f;      /* planting green */
    --accent-fg: #ffffff;
    --warn-bg: #fff3d6;
    --warn-fg: #6b4a00;
    --font-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
    --font-body: "Inter", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141b20; --panel: rgba(24, 32, 38, 0.86); --fg: #e6edf1; --muted: #9aa8b1;
      --line: rgba(230, 237, 241, 0.16); --accent: #5fbf84; --accent-fg: #0d1a12;
      --warn-bg: #3a2f12; --warn-fg: #f5d68a; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141b20; --panel: rgba(24, 32, 38, 0.86); --fg: #e6edf1; --muted: #9aa8b1;
    --line: rgba(230, 237, 241, 0.16); --accent: #5fbf84; --accent-fg: #0d1a12;
    --warn-bg: #3a2f12; --warn-fg: #f5d68a; color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); overflow: hidden; }
  #view { position: fixed; inset: 0; touch-action: none; }
  #view canvas { display: block; width: 100%; height: 100%; }
  .card {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 16px);
    left: max(16px, env(safe-area-inset-left, 0px));
    max-width: min(320px, calc(100vw - 32px));
    background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
    display: flex; flex-direction: column; gap: 10px;
  }
  h1 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; letter-spacing: -0.01em; }
  .sub { margin: 0; color: var(--muted); font-size: 0.8rem; font-variant-numeric: tabular-nums; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  button {
    font: 500 0.82rem var(--font-body); color: var(--fg); background: transparent;
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 11px; cursor: pointer;
  }
  .seg button { border: 0; border-radius: 0; }
  .seg button + button { border-left: 1px solid var(--line); }
  button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .warn { background: var(--warn-bg); color: var(--warn-fg); border-radius: 8px; padding: 8px 10px; font-size: 0.78rem; line-height: 1.4; }
  .hint {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
    max-width: calc(100vw - 32px);
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 14px; font-size: 0.78rem; color: var(--muted); text-align: center;
  }
  kbd { font-family: var(--font-body); font-size: 0.72rem; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; color: var(--fg); }
  #error { position: fixed; inset: 0; display: grid; place-items: center; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
  #error p { max-width: 46ch; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; line-height: 1.5; }
</style>

<div id="view" aria-label="3D view of the atrium"></div>

<div class="card">
  <div>
    <h1>Atrium 3D</h1>
    <p class="sub" id="stats">Loading scene…</p>
  </div>
  <div class="row">
    <div class="seg" role="group" aria-label="Navigation mode">
      <button id="btn-orbit" aria-pressed="true">Orbit</button>
      <button id="btn-walk" aria-pressed="false">Walk</button>
    </div>
    <button id="btn-zones" aria-pressed="false">Zones</button>
    <button id="btn-reset">Reset view</button>
  </div>
  <div class="warn" id="warn" hidden></div>
</div>

<div class="hint" id="hint">Drag to rotate · scroll or pinch to zoom · right-drag to pan</div>
<div id="error" hidden><p id="error-text"></p></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  "use strict";
  const T = THREE;
  const deg = (d) => (d || 0) * Math.PI / 180;

  // ---------- renderer, scene, camera ----------
  const host = document.getElementById("view");
  const renderer = new T.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputEncoding = T.sRGBEncoding;
  renderer.toneMapping = T.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = T.PCFSoftShadowMap;
  host.appendChild(renderer.domElement);

  const scene = new T.Scene();
  scene.background = new T.Color("#cfdbe6");
  scene.fog = new T.Fog("#cfdbe6", 45, 90);

  const camera = new T.PerspectiveCamera(55, 1, 0.05, 200);
  const ORBIT_START = { pos: new T.Vector3(4, 13, 21), target: new T.Vector3(-1, 1.2, -1.5) };
  const WALK_START = { pos: new T.Vector3(0, 1.6, 6.5), yaw: 0, pitch: 0.05 };
  camera.position.copy(ORBIT_START.pos);

  const controls = new T.OrbitControls(camera, renderer.domElement);
  controls.target.copy(ORBIT_START.target);
  controls.enableDamping = true;
  controls.maxPolarAngle = Math.PI * 0.495;
  controls.minDistance = 2;
  controls.maxDistance = 60;
  controls.update();

  // ---------- lights ----------
  scene.add(new T.HemisphereLight("#eef4fb", "#7c858d", 0.75));
  const sun = new T.DirectionalLight("#fff6e8", 1.6);
  sun.position.set(8, 24, 10);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -18, right: 18, top: 16, bottom: -16, near: 1, far: 60 });
  sun.shadow.bias = -0.0005;
  scene.add(sun);
  const fill = new T.PointLight("#ffe2b8", 0.35, 18); // warm interior light under mezzanine
  fill.position.set(0, 2.6, -9.5);
  scene.add(fill);

  // ---------- materials ----------
  const M = {
    carpet: new T.MeshStandardMaterial({ color: "#7c8794", roughness: 1 }),
    concrete: new T.MeshStandardMaterial({ color: "#b8b5ae", roughness: 0.95 }),
    white: new T.MeshStandardMaterial({ color: "#efefeb", roughness: 0.9 }),
    whiteIn: new T.MeshStandardMaterial({ color: "#efefeb", roughness: 0.9, side: T.FrontSide }),
    black: new T.MeshStandardMaterial({ color: "#26282b", roughness: 0.7 }),
    oak: new T.MeshStandardMaterial({ color: "#c99a5c", roughness: 0.7 }),
    glass: new T.MeshStandardMaterial({ color: "#cfe3ee", roughness: 0.05, metalness: 0.1, transparent: true, opacity: 0.22, depthWrite: false, side: T.DoubleSide }),
    frosted: new T.MeshStandardMaterial({ color: "#f3f4f2", roughness: 0.9, transparent: true, opacity: 0.75, side: T.DoubleSide }),
    steel: new T.MeshStandardMaterial({ color: "#8d9296", roughness: 0.4, metalness: 0.6 }),
    vent: new T.MeshStandardMaterial({ color: "#3b4045", roughness: 0.8 }),
    pot: new T.MeshStandardMaterial({ color: "#2f3236", roughness: 0.8, flatShading: true }),
    soil: new T.MeshStandardMaterial({ color: "#3b2a1e", roughness: 1 }),
    bark: new T.MeshStandardMaterial({ color: "#6b4f35", roughness: 1, flatShading: true }),
    lowerFloor: new T.MeshStandardMaterial({ color: "#5f6872", roughness: 1 }),
  };
  const leafMats = ["#3f7d3a", "#2f6a34", "#4f8f3f", "#5c9a46", "#2a5a2e"].map((c) =>
    new T.MeshStandardMaterial({ color: c, roughness: 0.8, flatShading: true, side: T.DoubleSide }));
  const matCache = {};
  function colorMat(hex, opts) {
    const key = hex + JSON.stringify(opts || {});
    if (!matCache[key]) matCache[key] = new T.MeshStandardMaterial(Object.assign({ color: hex, roughness: 0.6 }, opts));
    return matCache[key];
  }

  function box(w, h, d, mat, x, y, z, shadow) {
    const m = new T.Mesh(new T.BoxGeometry(w, h, d), mat);
    m.position.set(x, y, z);
    if (shadow !== false) { m.castShadow = true; m.receiveShadow = true; }
    return m;
  }
  function cyl(rt, rb, h, mat, x, y, z, seg) {
    const m = new T.Mesh(new T.CylinderGeometry(rt, rb, h, seg || 16), mat);
    m.position.set(x, y, z);
    m.castShadow = true; m.receiveShadow = true;
    return m;
  }
  // a one-sided plane that faces `normal`; invisible from behind, so outer walls disappear when orbiting outside
  function inwardPlane(w, h, mat, pos, rotY, rotX) {
    const m = new T.Mesh(new T.PlaneGeometry(w, h), mat);
    m.position.copy(pos);
    m.rotation.set(rotX || 0, rotY || 0, 0, "YXZ");
    m.receiveShadow = true;
    return m;
  }

  // ---------- static building shell (not editable via scene.json) ----------
  const shell = new T.Group();
  scene.add(shell);
  const X0 = -14, X1 = 12, Z0 = -12, Z1 = 8, H = 10;
  const VOID = { x0: -14, x1: -8.5, z0: -4, z1: 5 };
  const MEZZ_Z = -6.4, SLAB_Y = 3.0;

  function floorPiece(x0, x1, z0, z1) {
    const m = box(x1 - x0, 0.1, z1 - z0, M.carpet, (x0 + x1) / 2, -0.05, (z0 + z1) / 2, false);
    m.receiveShadow = true;
    shell.add(m);
  }
  floorPiece(VOID.x1, X1, Z0, Z1);
  floorPiece(X0, VOID.x1, Z0, VOID.z0);
  floorPiece(X0, VOID.x1, VOID.z1, Z1);
  // lower level visible through the stair void
  const lower = box(VOID.x1 - X0, 0.1, VOID.z1 - VOID.z0, M.lowerFloor, (X0 + VOID.x1) / 2, -3.65, (VOID.z0 + VOID.z1) / 2, false);
  lower.receiveShadow = true; shell.add(lower);
  // stairs descending inside the void
  for (let i = 0; i < 18; i++) {
    shell.add(box(1.6, 0.2, 0.3, M.concrete, -9.5, -0.2 * i - 0.1, VOID.z0 + 0.3 + i * 0.3));
  }
  // glass railing around the void with oak handrail
  function railing(x0, z0, x1, z1) {
    const len = Math.hypot(x1 - x0, z1 - z0), ang = Math.atan2(z1 - z0, x1 - x0);
    const g = new T.Group();
    g.position.set((x0 + x1) / 2, 0, (z0 + z1) / 2); g.rotation.y = -ang;
    const pane = new T.Mesh(new T.BoxGeometry(len, 1.0, 0.02), M.glass); pane.position.y = 0.55; g.add(pane);
    g.add(box(len, 0.06, 0.08, M.oak, 0, 1.08, 0));
    shell.add(g);
  }
  railing(VOID.x1, VOID.z0, VOID.x1, VOID.z1);
  railing(X0, VOID.z0, VOID.x1 - 1.8, VOID.z0);
  railing(X0, VOID.z1, VOID.x1, VOID.z1);

  // outer walls: one-sided, facing inwards
  shell.add(inwardPlane(X1 - X0, H, M.whiteIn, new T.Vector3((X0 + X1) / 2, H / 2, Z0), 0));               // back
  shell.add(inwardPlane(Z1 - Z0, H, M.whiteIn, new T.Vector3(X0, H / 2, (Z0 + Z1) / 2), Math.PI / 2));     // left
  const concreteIn = new T.MeshStandardMaterial({ color: "#b8b5ae", roughness: 0.95 });
  shell.add(inwardPlane(Z1 - Z0, H, concreteIn, new T.Vector3(X1, H / 2, (Z0 + Z1) / 2), -Math.PI / 2));   // right (concrete)
  // elevator in the right wall
  shell.add(box(0.12, 2.4, 1.5, M.steel, X1 - 0.06, 1.2, 4.0));
  shell.add(box(0.1, 2.6, 1.8, M.black, X1 - 0.03, 1.3, 4.0));
  shell.add(box(0.14, 0.02, 0.02, M.black, X1 - 0.06, 1.2, 4.0)); // door seam
  // concrete wall nib beside the stair void (left front)
  shell.add(box(0.5, H, 3, M.concrete, X0 + 0.25, H / 2, 6.5));

  // mezzanine slab along the back and the right
  const slab = box(X1 - X0, 0.4, MEZZ_Z - Z0, M.white, (X0 + X1) / 2, SLAB_Y + 0.2, (Z0 + MEZZ_Z) / 2);
  shell.add(slab);
  shell.add(box(X1 - 9.4, 0.4, Z1 - MEZZ_Z, M.white, (9.4 + X1) / 2, SLAB_Y + 0.2, (MEZZ_Z + Z1) / 2));
  // parapet (the big white band in the photo) and the dark ventilation strip
  shell.add(box(X1 - X0 - 2.6, 1.6, 0.25, M.white, (X0 + X1) / 2 - 1.3, SLAB_Y + 1.2, MEZZ_Z));
  shell.add(box(0.25, 1.6, Z1 - MEZZ_Z, M.white, 9.4, SLAB_Y + 1.2, (MEZZ_Z + Z1) / 2));
  // upper storey wall set back behind the parapet, with grille band
  shell.add(box(X1 - X0 - 2.6, H - SLAB_Y - 0.4, 0.3, M.white, (X0 + X1) / 2 - 1.3, (SLAB_Y + 0.4 + H) / 2, -9.6));
  shell.add(box(X1 - X0 - 3.2, 1.0, 0.05, M.vent, (X0 + X1) / 2 - 1.3, 7.6, -9.43, false));
  for (let x = -12; x <= 6; x += 6) shell.add(box(0.6, 0.25, 0.04, M.vent, x, 4.2, MEZZ_Z + 0.14, false));

  // pillars
  [[-7.2, MEZZ_Z - 0.1], [3.4, MEZZ_Z - 0.1], [-11.6, MEZZ_Z - 0.1]].forEach(([x, z]) =>
    shell.add(cyl(0.38, 0.38, SLAB_Y, M.concrete, x, SLAB_Y / 2, z, 24)));

  // glazed meeting rooms under the mezzanine
  const GLASS_Z = -7.3;
  const front = new T.Mesh(new T.BoxGeometry(X1 - X0 - 0.4, SLAB_Y, 0.03), M.glass);
  front.position.set((X0 + X1) / 2, SLAB_Y / 2, GLASS_Z); shell.add(front);
  for (let x = X0 + 0.4; x < X1; x += 2.2) shell.add(box(0.06, SLAB_Y, 0.08, M.black, x, SLAB_Y / 2, GLASS_Z));
  shell.add(box(X1 - X0, 0.08, 0.1, M.black, (X0 + X1) / 2, SLAB_Y - 0.04, GLASS_Z));
  // frosted blinds, dark wall panels and partition walls between rooms
  [[-12.6, 1.6], [-4.6, 3.6], [4.8, 3.0]].forEach(([x, w]) => {
    const b = new T.Mesh(new T.PlaneGeometry(w, 1.6), M.frosted); b.position.set(x, 1.35, GLASS_Z - 0.05); shell.add(b);
  });
  [[-9.1, 1.8], [-1.4, 1.4], [8.4, 1.6]].forEach(([x, w]) => shell.add(box(w, SLAB_Y, 0.1, M.black, x, SLAB_Y / 2, GLASS_Z - 0.06)));
  for (let x = -10; x <= 10; x += 5) shell.add(box(0.12, SLAB_Y, Math.abs(Z0 - GLASS_Z), M.white, x, SLAB_Y / 2, (Z0 + GLASS_Z) / 2));
  // a few desks inside the rooms
  [[-12.6, -9.5], [-4.6, -9.8], [4.8, -9.6], [10.4, -9.6]].forEach(([x, z]) => shell.add(box(1.6, 0.74, 0.8, M.white, x, 0.37, z)));

  // glass roof with beams (sloping slightly), plus opaque ceiling planes that face down only
  const SKY = { x0: -12, x1: 8, z0: -6, z1: 8 };
  const roof = new T.Group(); roof.position.y = H; shell.add(roof);
  const roofGlass = new T.Mesh(new T.PlaneGeometry(SKY.x1 - SKY.x0, SKY.z1 - SKY.z0), M.glass);
  roofGlass.rotation.x = -Math.PI / 2; roofGlass.position.set((SKY.x0 + SKY.x1) / 2, 0, (SKY.z0 + SKY.z1) / 2);
  roof.add(roofGlass);
  for (let z = SKY.z0; z <= SKY.z1 + 0.01; z += 1.75) roof.add(box(SKY.x1 - SKY.x0, 0.22, 0.14, M.white, (SKY.x0 + SKY.x1) / 2, -0.11, z, false));
  for (let x = SKY.x0; x <= SKY.x1 + 0.01; x += 5) roof.add(box(0.2, 0.5, SKY.z1 - SKY.z0, M.white, x, -0.25, (SKY.z0 + SKY.z1) / 2, false));
  const ceilDown = (x0, x1, z0, z1) => shell.add(inwardPlane(x1 - x0, z1 - z0, M.whiteIn, new T.Vector3((x0 + x1) / 2, H, (z0 + z1) / 2), 0, Math.PI / 2));
  ceilDown(X0, X1, Z0, SKY.z0); ceilDown(SKY.x1, X1, SKY.z0, Z1); ceilDown(X0, SKY.x0, SKY.z0, Z1);
  // underside of mezzanine (ceiling of ground floor)
  shell.traverse((o) => { if (o.isMesh && o.material === M.glass) { o.castShadow = false; o.receiveShadow = false; } });

  // ---------- object library (built from scene.json) ----------
  function hashSeed(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const VARIANT = { small: 0.6, medium: 1, large: 1.45 };
  const leafGeo = new T.OctahedronGeometry(1, 0); leafGeo.scale(0.11, 0.018, 0.06);

  // scatter `count` leaves using pointFn(r) -> Vector3; returns an InstancedMesh per shade
  function leaves(count, rand, pointFn, size) {
    const g = new T.Group();
    const perMat = leafMats.map(() => []);
    const dummy = new T.Object3D();
    for (let i = 0; i < count; i++) {
      const p = pointFn(rand);
      dummy.position.copy(p);
      dummy.rotation.set((rand() - 0.5) * 1.6, rand() * Math.PI * 2, (rand() - 0.5) * 1.2);
      const s = (size || 1) * (0.75 + rand() * 0.6);
      dummy.scale.set(s, s, s);
      dummy.updateMatrix();
      perMat[Math.floor(rand() * leafMats.length)].push(dummy.matrix.clone());
    }
    perMat.forEach((mats, i) => {
      if (!mats.length) return;
      const im = new T.InstancedMesh(leafGeo, leafMats[i], mats.length);
      mats.forEach((m, j) => im.setMatrixAt(j, m));
      im.castShadow = true; im.receiveShadow = true;
      g.add(im);
    });
    return g;
  }
  function inSphere(rand, c, rx, ry, rz) {
    let x, y, z;
    do { x = rand() * 2 - 1; y = rand() * 2 - 1; z = rand() * 2 - 1; } while (x * x + y * y + z * z > 1);
    return new T.Vector3(c.x + x * rx, c.y + y * ry, c.z + z * rz);
  }
  function pot(r, h, mat) {
    const g = new T.Group();
    g.add(cyl(r, r * 0.78, h, mat || M.pot, 0, h / 2, 0, 12));
    const s = new T.Mesh(new T.CircleGeometry(r * 0.92, 12), M.soil); s.rotation.x = -Math.PI / 2; s.position.y = h - 0.03; g.add(s);
    return g;
  }

  const LIB = {
    "plant-tree"(o, rand) {
      const k = VARIANT[o.variant] || 1, g = new T.Group();
      const height = 2.0 * k;
      g.add(pot(0.28 * Math.sqrt(k), 0.5 * Math.sqrt(k), o.color ? colorMat(o.color) : null));
      const potH = 0.5 * Math.sqrt(k);
      g.add(cyl(0.025 * k, 0.04 * k, height * 0.7, M.bark, 0, potH + height * 0.35, 0, 6));
      const clusters = Math.round(5 + 4 * k);
      for (let i = 0; i < clusters; i++) {
        const a = rand() * Math.PI * 2, r = (0.15 + rand() * 0.45) * k;
        const y = potH + height * (0.35 + rand() * 0.6);
        const tip = new T.Vector3(Math.cos(a) * r, y, Math.sin(a) * r);
        const base = new T.Vector3(0, y - 0.3 * k, 0);
        const br = new T.Mesh(new T.CylinderGeometry(0.008 * k, 0.015 * k, base.distanceTo(tip), 5), M.bark);
        br.position.copy(base).lerp(tip, 0.5); br.lookAt(tip); br.rotateX(Math.PI / 2); g.add(br);
        g.add(leaves(Math.round(36 * k), rand, (rr) => inSphere(rr, tip, 0.32 * k, 0.26 * k, 0.32 * k), 1.6 * Math.sqrt(k)));
      }
      return g;
    },
    "plant-shrub"(o, rand) {
      const k = VARIANT[o.variant] || 1, g = new T.Group();
      const potH = 0.32 * k;
      g.add(pot(0.22 * k, potH, o.color ? colorMat(o.color) : null));
      g.add(leaves(Math.round(110 * k), rand, (rr) => {
        const p = inSphere(rr, new T.Vector3(0, potH + 0.3 * k, 0), 0.38 * k, 0.32 * k, 0.38 * k);
        p.y = Math.max(p.y, potH); return p;
      }, 1.4 * Math.sqrt(k)));
      return g;
    },
    "plant-hanging"(o, rand) {
      // position = bottom of the hanging pot
      const k = VARIANT[o.variant] || 1, g = new T.Group();
      const r = 0.16 * k;
      const bowl = new T.Mesh(new T.SphereGeometry(r, 12, 6, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2), o.color ? colorMat(o.color) : M.pot);
      bowl.rotation.x = Math.PI; bowl.position.y = r; bowl.castShadow = true; g.add(bowl);
      for (let i = 0; i < 3; i++) {
        const a = i * Math.PI * 2 / 3;
        const p0 = new T.Vector3(Math.cos(a) * r, r, Math.sin(a) * r), p1 = new T.Vector3(0, r + 0.7, 0);
        const c = new T.Mesh(new T.CylinderGeometry(0.004, 0.004, p0.distanceTo(p1), 4), M.steel);
        c.position.copy(p0).lerp(p1, 0.5); c.lookAt(p1); c.rotateX(Math.PI / 2); g.add(c);
      }
      const strands = Math.round(9 * k);
      for (let s = 0; s < strands; s++) {
        const a = rand() * Math.PI * 2, len = (0.4 + rand() * 0.9) * k;
        const x0 = Math.cos(a) * r * 0.9, z0 = Math.sin(a) * r * 0.9;
        g.add(leaves(Math.round(14 * len / k + 4), rand, (rr) => {
          const t = rr();
          return new T.Vector3(x0 * (1 + t * 0.6) + (rr() - 0.5) * 0.06, r - t * len, z0 * (1 + t * 0.6) + (rr() - 0.5) * 0.06);
        }, 0.9));
      }
      g.add(leaves(Math.round(30 * k), rand, (rr) => inSphere(rr, new T.Vector3(0, r + 0.08, 0), r * 1.2, 0.1, r * 1.2), 1.1));
      return g;
    },
    "planter-box"(o, rand) {
      const [w, h, d] = o.size || [1.6, 0.5, 0.5];
      const g = new T.Group();
      g.add(box(w, h, d, o.color ? colorMat(o.color) : M.pot, 0, h / 2, 0));
      const soil = new T.Mesh(new T.PlaneGeometry(w - 0.06, d - 0.06), M.soil); soil.rotation.x = -Math.PI / 2; soil.position.y = h - 0.02; g.add(soil);
      g.add(leaves(Math.min(1500, Math.round(w * d * 420)), rand, (rr) =>
        new T.Vector3((rr() - 0.5) * w * 0.98, h + Math.pow(rr(), 1.6) * 0.5, (rr() - 0.5) * d * 0.98), 1.3));
      return g;
    },
    "green-wall"(o, rand) {
      // position = bottom centre of the panel, leaves face local +z
      const [w, h] = o.size || [2, 2.4];
      const g = new T.Group();
      g.add(box(w, h, 0.06, M.pot, 0, h / 2, 0.03));
      g.add(leaves(Math.min(5000, Math.round(w * h * 260)), rand, (rr) =>
        new T.Vector3((rr() - 0.5) * w * 0.98, rr() * h, 0.08 + rr() * 0.12), 1.2));
      return g;
    },

    "table-work"(o) {
      const [w, h, d] = o.size || [3.2, 0.74, 1.3], g = new T.Group();
      g.add(box(w, 0.04, d, M.white, 0, h - 0.02, 0));
      [[-1, -1], [-1, 1], [1, -1], [1, 1]].forEach(([sx, sz]) => {
        const leg = box(0.04, h, 0.04, M.oak, sx * (w / 2 - 0.25), h / 2, sz * (d / 2 - 0.12));
        leg.rotation.z = sx * 0.12; g.add(leg);
      });
      return g;
    },
    "chair-shell"(o) {
      const g = new T.Group(), mat = colorMat(o.color || "#d8c72a");
      const seat = box(0.46, 0.05, 0.44, mat, 0, 0.45, 0); g.add(seat);
      const back = box(0.46, 0.38, 0.04, mat, 0, 0.67, -0.21); back.rotation.x = -0.15; g.add(back);
      [[-1, -1], [-1, 1], [1, -1], [1, 1]].forEach(([sx, sz]) => {
        const l = box(0.015, 0.45, 0.015, M.black, sx * 0.18, 0.22, sz * 0.17); l.rotation.set(sz * 0.18, 0, sx * 0.18); g.add(l);
      });
      return g;
    },
    "chair-lounge"(o) {
      const g = new T.Group(), mat = colorMat(o.color || "#b9c832", { roughness: 0.95 });
      const shellM = new T.Mesh(new T.SphereGeometry(0.42, 18, 10, 0, Math.PI * 2, Math.PI * 0.35, Math.PI * 0.4), new T.MeshStandardMaterial({ color: mat.color, roughness: 0.95, side: T.DoubleSide }));
      shellM.position.y = 0.72; shellM.rotation.x = 0.35; shellM.castShadow = true; g.add(shellM);
      g.add(cyl(0.32, 0.32, 0.08, mat, 0, 0.42, 0.05, 18));
      [[-1, -1], [-1, 1], [1, -1], [1, 1]].forEach(([sx, sz]) => g.add(box(0.02, 0.4, 0.02, M.black, sx * 0.24, 0.2, sz * 0.24)));
      return g;
    },
    "side-table"(o) {
      const g = new T.Group();
      g.add(cyl(0.22, 0.22, 0.03, M.black, 0, 0.45, 0, 20)); g.add(cyl(0.02, 0.02, 0.45, M.black, 0, 0.22, 0, 6)); g.add(cyl(0.16, 0.16, 0.02, M.black, 0, 0.01, 0, 16));
      return g;
    },
    "bar-stool"(o) {
      const g = new T.Group();
      g.add(cyl(0.2, 0.18, 0.08, colorMat(o.color || "#e4e4e0"), 0, 0.76, 0, 18));
      [0, 1, 2, 3].forEach((i) => { const a = i * Math.PI / 2 + Math.PI / 4; const l = box(0.03, 0.78, 0.03, M.oak, Math.cos(a) * 0.14, 0.38, Math.sin(a) * 0.14); l.rotation.set(Math.sin(a) * 0.15, 0, -Math.cos(a) * 0.15); g.add(l); });
      g.add(new T.Mesh(new T.TorusGeometry(0.17, 0.012, 6, 20), M.oak).rotateX(Math.PI / 2).translateZ(-0.28));
      return g;
    },
    "kitchen-island"(o) {
      const [w, h, d] = o.size || [3, 1.05, 1], g = new T.Group();
      g.add(box(w, h - 0.04, d, M.oak, 0, (h - 0.04) / 2, 0));
      g.add(box(w + 0.1, 0.04, d + 0.3, M.oak, 0, h - 0.02, 0.1));
      return g;
    },
    "counter"(o) {
      const [w, h, d] = o.size || [3, 1, 0.8], g = new T.Group();
      g.add(box(w, h, d, M.white, 0, h / 2, 0));
      g.add(box(w, 0.04, d + 0.04, colorMat("#d9dadb"), 0, h + 0.02, 0));
      return g;
    },
    "coffee-machine"(o) {
      const g = new T.Group();
      g.add(box(0.45, 0.6, 0.45, M.black, 0, 0.3, 0));
      g.add(box(0.3, 0.12, 0.02, colorMat("#7aa7d6", { emissive: "#24435f" }), 0, 0.45, 0.235));
      return g;
    },
    "poster-frame"(o) {
      const [w, h, d] = o.size || [1.3, 3.4, 0.5], g = new T.Group();
      [[-1, -1], [-1, 1], [1, -1], [1, 1]].forEach(([sx, sz]) => g.add(box(0.05, h, 0.05, M.oak, sx * w / 2, h / 2, sz * d / 2)));
      [0.08, h - 0.03].forEach((y) => { g.add(box(w, 0.05, 0.05, M.oak, 0, y, -d / 2)); g.add(box(w, 0.05, 0.05, M.oak, 0, y, d / 2)); g.add(box(0.05, 0.05, d, M.oak, -w / 2, y, 0)); g.add(box(0.05, 0.05, d, M.oak, w / 2, y, 0)); });
      g.add(box(w * 0.88, h * 0.5, 0.02, colorMat(o.color || "#2b2d8f", { roughness: 0.5 }), 0, h * 0.52, 0));
      return g;
    },
    "shelf"(o) {
      const [w, h, d] = o.size || [2.4, 1.6, 0.45], g = new T.Group();
      [0.05, h * 0.5, h].forEach((y) => g.add(box(w, 0.03, d, M.black, 0, y, 0)));
      [-1, 1].forEach((s) => g.add(box(0.03, h, d, M.black, s * w / 2, h / 2, 0)));
      return g;
    },
    "booth"(o) {
      const [w, h, d] = o.size || [1.3, 2.3, 1.3], g = new T.Group();
      g.add(box(w, h, 0.06, M.oak, 0, h / 2, -d / 2)); g.add(box(0.06, h, d, M.oak, -w / 2, h / 2, 0)); g.add(box(0.06, h, d, M.oak, w / 2, h / 2, 0));
      g.add(box(w, 0.06, d, M.oak, 0, h, 0));
      const door = new T.Mesh(new T.BoxGeometry(w - 0.1, h - 0.1, 0.02), M.glass); door.position.set(0, h / 2, d / 2); g.add(door);
      return g;
    },
  };

  function placeholder(o) {
    const g = new T.Group();
    const s = 0.6;
    g.add(box(s, s, s, colorMat("#e0338a", { transparent: true, opacity: 0.55 }), 0, s / 2, 0));
    const edges = new T.LineSegments(new T.EdgesGeometry(new T.BoxGeometry(s, s, s)), new T.LineBasicMaterial({ color: "#e0338a" }));
    edges.position.y = s / 2; g.add(edges);
    return g;
  }

  // ---------- build objects from scene.json ----------
  const objectsRoot = new T.Group(); scene.add(objectsRoot);
  let warnings = [];
  function buildObjects(data) {
    objectsRoot.clear();
    warnings = [];
    const list = Array.isArray(data.objects) ? data.objects : [];
    list.forEach((o, i) => {
      const id = o.id || ("object-" + i);
      const make = LIB[o.type];
      let g;
      try {
        g = make ? make(o, rng(hashSeed(id))) : placeholder(o);
        if (!make) warnings.push(`"${id}": unknown type "${o.type}" (shown as a pink box)`);
      } catch (e) {
        g = placeholder(o); warnings.push(`"${id}": could not be built (${e.message})`);
      }
      const p = Array.isArray(o.position) ? o.position : [0, 0, 0];
      g.position.set(+p[0] || 0, +p[1] || 0, +p[2] || 0);
      g.rotation.y = deg(o.rotation);
      const sc = o.scale;
      if (Array.isArray(sc)) g.scale.set(sc[0], sc[1], sc[2]); else if (typeof sc === "number") g.scale.setScalar(sc);
      g.name = id; g.userData = { type: o.type };
      objectsRoot.add(g);
    });
    const plants = list.filter((o) => /^(plant-|planter-|green-)/.test(o.type)).length;
    document.getElementById("stats").textContent = `${list.length} objects · ${plants} plants`;
    const w = document.getElementById("warn");
    w.hidden = !warnings.length;
    w.textContent = warnings.length ? "Scene file warnings: " + warnings.join("; ") : "";
    window.atrium.warnings = warnings;
  }

  // ---------- zones overlay ----------
  const zonesRoot = new T.Group(); zonesRoot.visible = false; scene.add(zonesRoot);
  function labelSprite(text) {
    const c = document.createElement("canvas"), ctx = c.getContext("2d");
    const fs = 44; ctx.font = `600 ${fs}px "Space Grotesk", sans-serif`;
    const w = Math.ceil(ctx.measureText(text).width) + 36; c.width = w; c.height = fs + 26;
    ctx.font = `600 ${fs}px "Space Grotesk", sans-serif`;
    ctx.fillStyle = "rgba(20,40,30,0.82)"; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(0, 0, w, c.height, 14) : ctx.rect(0, 0, w, c.height); ctx.fill();
    ctx.fillStyle = "#ffffff"; ctx.textBaseline = "middle"; ctx.fillText(text, 18, c.height / 2 + 2);
    const tex = new T.CanvasTexture(c); tex.encoding = T.sRGBEncoding;
    const s = new T.Sprite(new T.SpriteMaterial({ map: tex, depthTest: false, transparent: true }));
    s.scale.set(w / c.height * 0.55, 0.55, 1); s.renderOrder = 10;
    return s;
  }
  function buildZones(data) {
    zonesRoot.clear();
    (data.zones || []).forEach((z, i) => {
      const [x0, x1] = z.x, [z0, z1] = z.z;
      const hue = (i * 47) % 360;
      const col = new T.Color(`hsl(${hue}, 60%, 50%)`);
      const y = z.id === "skylight" ? H - 0.3 : z.id === "mezzanine-railing" ? SLAB_Y + 1.9 : z.id === "stair-void" ? 0.02 : 0.03;
      const plane = new T.Mesh(new T.PlaneGeometry(x1 - x0, z1 - z0), new T.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.22, depthWrite: false, side: T.DoubleSide }));
      plane.rotation.x = -Math.PI / 2; plane.position.set((x0 + x1) / 2, y, (z0 + z1) / 2); zonesRoot.add(plane);
      const edge = new T.LineSegments(new T.EdgesGeometry(new T.PlaneGeometry(x1 - x0, z1 - z0)), new T.LineBasicMaterial({ color: col }));
      edge.rotation.x = -Math.PI / 2; edge.position.copy(plane.position); zonesRoot.add(edge);
      const lab = labelSprite(z.id); lab.position.set((x0 + x1) / 2, y + 0.6, (z0 + z1) / 2); zonesRoot.add(lab);
    });
  }

  // ---------- navigation: orbit / walk ----------
  let mode = "orbit";
  const walk = { yaw: 0, pitch: 0, keys: {}, dragging: false, lx: 0, ly: 0 };
  const hint = document.getElementById("hint");
  const btnOrbit = document.getElementById("btn-orbit"), btnWalk = document.getElementById("btn-walk");
  function setMode(m) {
    mode = m;
    btnOrbit.setAttribute("aria-pressed", m === "orbit"); btnWalk.setAttribute("aria-pressed", m === "walk");
    controls.enabled = m === "orbit";
    if (m === "walk") {
      camera.position.copy(WALK_START.pos); walk.yaw = WALK_START.yaw; walk.pitch = WALK_START.pitch;
      hint.innerHTML = "<kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or arrows to walk · drag to look · <kbd>Shift</kbd> faster · <kbd>Esc</kbd> back to orbit";
      renderer.domElement.focus?.();
    } else {
      camera.position.copy(ORBIT_START.pos); controls.target.copy(ORBIT_START.target); controls.update();
      hint.textContent = "Drag to rotate · scroll or pinch to zoom · right-drag to pan";
    }
  }
  btnOrbit.addEventListener("click", () => setMode("orbit"));
  btnWalk.addEventListener("click", () => setMode("walk"));
  document.getElementById("btn-reset").addEventListener("click", () => setMode(mode));
  const btnZones = document.getElementById("btn-zones");
  btnZones.addEventListener("click", () => { zonesRoot.visible = !zonesRoot.visible; btnZones.setAttribute("aria-pressed", zonesRoot.visible); });

  window.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && mode === "walk") { setMode("orbit"); return; }
    if (mode === "walk") { walk.keys[e.code] = true; if (e.code.startsWith("Arrow")) e.preventDefault(); }
  });
  window.addEventListener("keyup", (e) => { walk.keys[e.code] = false; });
  window.addEventListener("blur", () => { walk.keys = {}; });
  const el = renderer.domElement;
  el.addEventListener("pointerdown", (e) => { if (mode !== "walk") return; walk.dragging = true; walk.lx = e.clientX; walk.ly = e.clientY; el.setPointerCapture(e.pointerId); });
  el.addEventListener("pointermove", (e) => {
    if (mode !== "walk" || !walk.dragging) return;
    walk.yaw -= (e.clientX - walk.lx) * 0.004; walk.pitch -= (e.clientY - walk.ly) * 0.004;
    walk.pitch = Math.max(-1.3, Math.min(1.3, walk.pitch)); walk.lx = e.clientX; walk.ly = e.clientY;
  });
  el.addEventListener("pointerup", () => { walk.dragging = false; });

  function blocked(x, z) {
    if (x < X0 + 0.4 || x > X1 - 0.4 || z < GLASS_Z + 0.35 || z > Z1 - 0.3) return true;
    if (x < VOID.x1 + 0.3 && z > VOID.z0 - 0.3 && z < VOID.z1 + 0.3) return true; // stair void
    return false;
  }
  function stepWalk(dt) {
    const k = walk.keys, speed = (k.ShiftLeft || k.ShiftRight ? 4.5 : 2.2) * dt;
    let f = 0, s = 0;
    if (k.KeyW || k.ArrowUp) f += 1; if (k.KeyS || k.ArrowDown) f -= 1;
    if (k.KeyD || k.ArrowRight) s += 1; if (k.KeyA || k.ArrowLeft) s -= 1;
    if (f || s) {
      const len = Math.hypot(f, s); f /= len; s /= len;
      const dx = (-Math.sin(walk.yaw) * f + Math.cos(walk.yaw) * s) * speed;
      const dz = (-Math.cos(walk.yaw) * f - Math.sin(walk.yaw) * s) * speed;
      if (!blocked(camera.position.x + dx, camera.position.z)) camera.position.x += dx;
      if (!blocked(camera.position.x, camera.position.z + dz)) camera.position.z += dz;
    }
    camera.position.y = 1.6;
    camera.rotation.set(walk.pitch, walk.yaw, 0, "YXZ");
  }

  // ---------- loop ----------
  function resize() {
    const w = host.clientWidth || window.innerWidth, h = host.clientHeight || window.innerHeight;
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", resize); resize();
  const clock = new T.Clock();
  renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), 0.1);
    if (mode === "orbit") controls.update(); else stepWalk(dt);
    renderer.render(scene, camera);
  });

  window.atrium = { scene, camera, setMode, warnings, ready: false, objectsRoot };

  // ---------- load scene.json ----------
  fetch("scene.json", { cache: "no-store" })
    .then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then((data) => { buildObjects(data); buildZones(data); window.atrium.data = data; window.atrium.ready = true; })
    .catch((e) => {
      document.getElementById("error-text").textContent = "The scene file (scene.json) could not be loaded: " + e.message + ". The building shell is shown without furniture or plants.";
      document.getElementById("error").hidden = false;
      document.getElementById("stats").textContent = "Scene file missing";
      window.atrium.ready = true;
    });
})();
</script>
